# Builds the combined RTX package (what Workshop item 3829070317 carries) on GitHub for a release, with every native
# binary in it built or fetched here (R16, ADR 0106): the Remix runtime from the fork with runtime/patches,
# the RTX fixes' modules, the debug module and the material editor's bridge from their pinned sources
# (tools/ci/pins.json), the Model Hotloader's natives from its source copy in packages/ (ADR 0107), this
# repository's own modules, and the files no workflow can compile downloaded from their publishers and
# checked against pinned SHA-256 hashes. No native binary comes from packages/.
#
# The run's summary reports the SHA-256 of the .gma and of every file in it, and where each native binary
# came from (tools/package_report.py); the artifact rtx-package-report keeps that report. The .gma is the
# artifact rtx-package, and only the newest one is kept: the older ones are deleted before it is uploaded.
# That order is deliberate (review R19, F-07): Actions storage is 2 GB, a package takes about 0.84 GB and
# the per-push bundles more, so two packages at once would fail the upload. A failed upload therefore
# leaves no package artifact; the last good package stays on the Workshop item and in the developer's
# out/workshop/ci, and a new run builds it again. tools/publish_workshop.py --from-ci, on the developer's
# machine (it needs Steam), uploads exactly that .gma to the Workshop after checking its SHA-256 against
# the report.
#
# Only a person starts it (Actions > Build the RTX package > Run workflow), when releasing (ADR 0108):
# no push, pull request, tag or schedule does. During development the Workshop item gets packages built
# on the developer's machine by tools/publish_workshop.py's git hooks.
#
# The runtime, the modules and the Hotloader's natives are cached by their sources (tools/ci/cache_key.py):
# a run rebuilds them only when those change, or when BUILD_SALT does. Git LFS objects are cached as well; the binaries this
# workflow makes are never downloaded from Git LFS.
name: Build the RTX package

on:
  workflow_dispatch:

# Read only: the build jobs run other people's build scripts and downloads. Only the package job, which
# deletes the older rtx-package artifacts, may write to Actions (review R19, F-04).
permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Change it to rebuild the cached runtime, modules and Hotloader natives (a new runner image or toolchain).
  BUILD_SALT: r16-1

jobs:
  runtime:
    name: Remix runtime (the fork with runtime/patches)
    runs-on: windows-2022
    timeout-minutes: 340
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache key (the runtime's sources)
        id: key
        shell: pwsh
        run: |
          $hash = python -I tools/ci/cache_key.py runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "key=runtime-$env:BUILD_SALT-$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: A runtime built from these sources already
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/runtime
            out/ci/built/provenance-runtime.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: The runner (disk, processors, memory)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, @{n='Free GB'; e={[math]::Round($_.Free / 1GB, 1)}}, @{n='Used GB'; e={[math]::Round($_.Used / 1GB, 1)}}
          "processors: $env:NUMBER_OF_PROCESSORS; memory: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)) GB"
          # The build needs about 12 GB: it goes to the drive with the most free space.
          $drive = (Get-PSDrive C, D -ErrorAction SilentlyContinue | Sort-Object Free -Descending | Select-Object -First 1).Name
          "NL_BUILD=$($drive):\nl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Meson and Pillow (what the fork's build runs)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check meson==1.12.1 pillow==12.3.0

      - name: The fork (runtime/base.json's repository; its commit is checked out by the build)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = Get-Content runtime/base.json -Raw | ConvertFrom-Json
          git clone --quiet --filter=blob:none --no-checkout $base.repository "$env:NL_BUILD\fork"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build (runtime/build_runtime.ps1 -Install, two Ninja jobs)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          # git am, which applies runtime/patches, records a committer.
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
        run: |
          $env:PM_PACKAGES_ROOT = "$env:NL_BUILD\packman-repo"
          ./runtime/build_runtime.ps1 -Fork "$env:NL_BUILD\fork" -Worktree "$env:NL_BUILD\tree" -NoImport -Install -Jobs 2

      - name: The runtime part's files from that build (tools/ci/collect_runtime.py)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python -I tools/ci/collect_runtime.py "$env:NL_BUILD\tree\_output" --out out/ci/built --run-url "$env:RUN_URL"

      - name: Disk after the build
        if: always() && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB'; e={[math]::Round($_.Free / 1GB, 1)}}, @{n='Used GB'; e={[math]::Round($_.Used / 1GB, 1)}}

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            out/ci/built/runtime
            out/ci/built/provenance-runtime.json
          key: ${{ steps.key.outputs.key }}

  modules:
    name: RTX fixes modules, debug module, material editor bridge
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache key (the modules' sources)
        id: key
        shell: pwsh
        run: |
          $hash = python -I tools/ci/cache_key.py modules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "key=modules-$env:BUILD_SALT-$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Modules built from these sources already
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/fixes/modules
            out/ci/built/advanced-material-editor
            out/ci/built/provenance-modules.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Build them (tools/ci/build_modules.ps1)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/ci/build_modules.ps1 -RunUrl "$env:RUN_URL"

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            out/ci/built/fixes/modules
            out/ci/built/advanced-material-editor
            out/ci/built/provenance-modules.json
          key: ${{ steps.key.outputs.key }}

  hotloader:
    name: Model Hotloader natives (its source copy in packages/)
    runs-on: windows-2022
    timeout-minutes: 150
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache key (the Hotloader's source, its build script and policy)
        id: key
        shell: pwsh
        run: |
          $hash = python -I tools/ci/cache_key.py hotloader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "key=hotloader-$env:BUILD_SALT-$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Natives built from this source already
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/model-hotloader
            out/ci/built/provenance-hotloader.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: The source's Git LFS content
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs pull --include="packages/model-hotloader/source/**"

      - name: Build them (tools/ci/build_hotloader.ps1; a short path, for assimp's deep folders)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/ci/build_hotloader.ps1 -Work "$env:RUNNER_TEMP\hl" -RunUrl "$env:RUN_URL"

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            out/ci/built/model-hotloader
            out/ci/built/provenance-hotloader.json
          key: ${{ steps.key.outputs.key }}

  package:
    name: The RTX package and its hash report
    needs: [runtime, modules, hotloader]
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write  # deletes the older rtx-package artifacts, the job's last step but one
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Git LFS objects the package reads (none of the binaries this workflow makes)
        shell: pwsh
        run: |
          git lfs ls-files --long | Where-Object { $_ -notmatch '\.(dll|exe)\.xz$' } | Sort-Object | Set-Content -Encoding utf8 .lfs-objects.txt
          "$((Get-Content .lfs-objects.txt).Count) Git LFS objects"

      - name: Cached Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs2-${{ hashFiles('.lfs-objects.txt') }}
          restore-keys: lfs2-

      - name: Git LFS content (only objects the cache lacks are downloaded)
        run: git lfs pull --exclude="*.dll.xz,*.exe.xz"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: packages/ against its indexes
        run: python -I tools/inputs.py verify

      - name: The runtime this run's runtime job built or found
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/runtime
            out/ci/built/provenance-runtime.json
          key: ${{ needs.runtime.outputs.key }}
          fail-on-cache-miss: true

      - name: The modules this run's modules job built or found
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/fixes/modules
            out/ci/built/advanced-material-editor
            out/ci/built/provenance-modules.json
          key: ${{ needs.modules.outputs.key }}
          fail-on-cache-miss: true

      - name: The Hotloader natives and records this run's hotloader job built or found
        uses: actions/cache/restore@v4
        with:
          path: |
            out/ci/built/model-hotloader
            out/ci/built/provenance-hotloader.json
          key: ${{ needs.hotloader.outputs.key }}
          fail-on-cache-miss: true

      - name: Release build of this repository (nlctl.exe, the RTX client module, the glass module)
        shell: pwsh
        run: ./tools/build.ps1 -Config Release -NoTests

      - name: This repository's modules (tools/ci/collect_repo_build.py)
        shell: pwsh
        run: python -I tools/ci/collect_repo_build.py --out out/ci/built --run-url "$env:RUN_URL"

      - name: The binaries no workflow compiles, from their publishers (tools/ci/fetch_prebuilt.py)
        shell: pwsh
        run: python -I tools/ci/fetch_prebuilt.py --out out/ci/built --run-url "$env:RUN_URL"

      - name: The RTX package (tools/build_package.py, every native binary from this run)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/report | Out-Null
          python -I tools/build_package.py --require-nlctl --built out/ci/built --out out/dist --json |
            Set-Content -Encoding utf8 out/report/package-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Hash report (tools/package_report.py) into this run's summary
        shell: pwsh
        run: |
          $gma = @(Get-ChildItem out/dist -Filter *.gma)
          if ($gma.Count -ne 1) { throw "expected one .gma in out/dist, found $($gma.Count)" }
          $provenance = @(Get-ChildItem out/ci/built -Filter 'provenance-*.json' | ForEach-Object { $_.FullName })
          python -I tools/package_report.py $gma[0].FullName --provenance @provenance --run-url "$env:RUN_URL" --commit "$env:GITHUB_SHA" `
            --json out/report/package-report.json --sums out/report/SHA256SUMS.txt --markdown "$env:GITHUB_STEP_SUMMARY"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $provenance out/report/

      - uses: actions/upload-artifact@v6
        with:
          name: rtx-package-report
          path: out/report/
          retention-days: 90
          if-no-files-found: error

      # Before this run's package is uploaded, deliberately (review R19, F-07): Actions storage cannot hold
      # two packages, so deleting afterwards would make the upload fail. This run's own artifacts are kept.
      - name: Only the newest package is kept (older rtx-package artifacts deleted)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=rtx-package&per_page=100" --jq ".artifacts[] | select(.workflow_run.id != $env:GITHUB_RUN_ID) | .id")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($id in $ids | Where-Object { $_ }) {
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "deleted the older rtx-package artifact $id"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: rtx-package
          path: out/dist/*.gma
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Disk at the end
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB'; e={[math]::Round($_.Free / 1GB, 1)}}, @{n='Used GB'; e={[math]::Round($_.Used / 1GB, 1)}}
