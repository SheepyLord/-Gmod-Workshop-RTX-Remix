# Builds winmm.dll (the loader) on every push and pull request, runs every check, and publishes the
# end-user bundle (winmm.dll, the default native-loader\config.json, a README) as an artifact. A tag
# v* also creates a GitHub release with the bundle (ADR 0017). The Workshop item is updated from the
# developer's machine by tools/publish_workshop.py, not here: that needs Steam.
name: Build winmm.dll

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages the tests use
        run: python -m pip install --disable-pip-version-check pillow

      - name: Conventions, Release build, CTest and Python tests (tools\test.ps1)
        shell: pwsh
        run: ./tools/test.ps1 -Config Release

      - name: End-user bundle (tools\package_loader.py)
        shell: pwsh
        run: python tools/package_loader.py --config Release --out out/dist --json

      - uses: actions/upload-artifact@v4
        with:
          name: gmod-native-loader
          path: out/dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            out/build/win64-release/Testing/Temporary/LastTest.log
            out/m4-synthetic/
            out/m5-synthetic/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gmod-native-loader
          path: dist

      - name: GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*.zip
          --repo "${{ github.repository }}"
          --title "Native loader ${{ github.ref_name }}"
          --notes "Extract gmod-native-loader-*.zip into your Garry's Mod folder (it adds bin\win64\winmm.dll and native-loader\config.json), subscribe to https://steamcommunity.com/sharedfiles/filedetails/?id=3829070317 and start the game on the x86-64 branch. The -symbols zip holds winmm.pdb for crash reports."
