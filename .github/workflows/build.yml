# Builds winmm.dll (the loader) on every push and pull request, runs every check, and publishes the
# end-user bundle (winmm.dll, the default native-loader\config.json, a README) as an artifact. A tag
# v* also creates a GitHub release with the bundle (ADR 0017); the release keeps its zips. Every
# artifact expires two days after its run (ADR 0113): Actions storage is 2 GB. The Workshop item is
# updated from the developer's machine by tools/publish_workshop.py, not here: that needs Steam.
name: Build winmm.dll

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # An exact version (review R19): the one package.yml installs and the tests run with on this machine.
      - name: Python packages the tests use
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      # Official source only; this pin was verified against LuaJIT/LuaJIT v2.1.
      # https://luajit.org/install.html (Windows/MSVC), src/msvcbuild.bat static.
      # Keep source, generated native files and compiler temporary files under out.
      - name: Build pinned LuaJIT for the Lua policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./tools/lib/VsDevEnv.psm1
          Enter-VsDevEnv
          $luaJitCommit = 'ea9eb7edb5eac4a9d175d74523db34fac0fa5180'
          $luaJitRoot = Join-Path $env:GITHUB_WORKSPACE 'out/ci-luajit'
          $luaJitTemp = Join-Path $env:GITHUB_WORKSPACE 'out/tmp/ci-luajit'
          New-Item -ItemType Directory -Force -Path $luaJitRoot, $luaJitTemp | Out-Null
          $env:TEMP = $luaJitTemp
          $env:TMP = $luaJitTemp
          git -C $luaJitRoot init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT git init failed' }
          git -C $luaJitRoot remote add origin https://github.com/LuaJIT/LuaJIT.git
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT official source setup failed' }
          git -C $luaJitRoot fetch --depth 1 origin $luaJitCommit
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT pinned source fetch failed' }
          git -C $luaJitRoot checkout --detach --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT pinned checkout failed' }
          if ((git -C $luaJitRoot rev-parse HEAD) -ne $luaJitCommit) { throw 'LuaJIT revision mismatch' }
          $luaJitBin = Join-Path $luaJitRoot 'src'
          Push-Location -LiteralPath $luaJitBin
          try {
            & .\msvcbuild.bat static
            if ($LASTEXITCODE -ne 0) { throw 'LuaJIT MSVC build failed' }
            & .\luajit.exe -e "assert(jit.os == 'Windows' and jit.arch == 'x64'); print(jit.version)"
            if ($LASTEXITCODE -ne 0) { throw 'LuaJIT x64 smoke check failed' }
          } finally { Pop-Location }
          $luaJitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Conventions, Release build, CTest and Python tests (tools\test.ps1)
        shell: pwsh
        run: |
          # Fail rather than silently skip the guard/companion LuaJIT scenarios.
          python -c "import shutil; assert shutil.which('luajit'), 'CI requires the pinned LuaJIT build'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test.ps1 -Config Release

      - name: End-user bundle (tools\package_loader.py)
        shell: pwsh
        run: python tools/package_loader.py --config Release --out out/dist --json

      - uses: actions/upload-artifact@v6
        with:
          name: gmod-native-loader
          path: out/dist/*.zip
          retention-days: 2
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-evidence
          path: |
            out/build/win64-release/Testing/Temporary/LastTest.log
            out/m4-synthetic/
            out/m5-synthetic/
          retention-days: 2
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: gmod-native-loader
          path: dist

      # The tag's name and the repository reach the shell only as environment variables, never pasted into
      # the script: a tag name is text whoever pushes it chooses, and a name such as v$(...) would run in
      # this job, which holds a token that can write releases (review R19, F-01).
      - name: GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip
          --repo "$REPOSITORY"
          --title "Native loader $RELEASE_TAG"
          --notes "Extract gmod-native-loader-*.zip into your Garry's Mod folder (it adds bin\win64\winmm.dll and native-loader\config.json), subscribe to https://steamcommunity.com/sharedfiles/filedetails/?id=3829070317 and start the game on the x86-64 branch. The -symbols zip holds winmm.pdb for crash reports."
