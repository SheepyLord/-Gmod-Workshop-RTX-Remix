# R6 low: bounded memory and less training work for smaller GPUs (ADR 0064).
# The loader selects this payload before the classic layer. User settings remain above it.

# Four query-path bounces bound ray work; the NRC cache supplies the remaining indirect light.
rtx.pathMaxBounces = 4
# NRC Medium: 2 training iterations, 6 training bounces, 6 cm cache detail instead of Ultra's 4/9/1 cm.
rtx.neuralRadianceCache.qualityPreset = 0
# Skip the largest streamed replacement mip and request lower-memory acceleration structures.
rtx.lowMemoryGpu = True
# Cap micromaps at 512 MiB and stop growth before the final 1 GiB of the driver's budget.
rtx.opacityMicromap.cache.maxBudgetSizeMB = 512
rtx.opacityMicromap.cache.minFreeVidmemMBToNotAllocate = 1024
# A 1024 sky probe saves 72 MiB against classic.
rtx.skyProbeSide = 1024
# A quarter of the classic froxels in X/Y, keeping its 48 depth slices for fog continuity.
rtx.volumetrics.froxelGridResolutionScale = 8
# A quarter of the terrain-atlas memory when terrain baking is active.
rtx.terrainBaker.cascadeMap.levelResolution = 2048
# Drop only mip 0 from the three existing sky images: 53.33 MiB instead of 213.33 MiB resident.
rtx.atmosphere.starMapTexture = atmosphere/stars_4096.dds
rtx.atmosphere.starMapGalaxyTexture = atmosphere/galaxy_4096.dds
rtx.atmosphere.starMapNebulaTexture = atmosphere/nebula_4096.dds
