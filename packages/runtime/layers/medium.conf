# R6 medium: a smaller GPU's compute and memory defaults (ADR 0064).
# The loader selects this payload before the classic layer. User settings remain above it.

# Eight query-path bounces retain indirect light while bounding long mirror/transmission paths.
rtx.pathMaxBounces = 8
# NRC High: 3 training iterations, 7 training bounces, 4 cm cache detail instead of Ultra's 4/9/1 cm.
rtx.neuralRadianceCache.qualityPreset = 1
# A 1024 sky probe uses 24 MiB instead of 96 MiB.
rtx.skyProbeSide = 1024
# Half the grid dimensions in X/Y: a quarter of the froxels, preserving the classic 48 depth slices.
rtx.volumetrics.froxelGridResolutionScale = 8
# Bound micromaps to 1 GiB and stop growth with 1 GiB free; OMM still accelerates alpha-tested rays.
rtx.opacityMicromap.cache.maxBudgetSizeMB = 1024
rtx.opacityMicromap.cache.minFreeVidmemMBToNotAllocate = 1024
# Terrain atlases use one quarter of their 4096-resolution memory when terrain baking is active.
rtx.terrainBaker.cascadeMap.levelResolution = 2048
